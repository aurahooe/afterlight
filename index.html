<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Afterlight</title>
  <meta name="description" content="A quiet room that changes every hour." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="top">
    <a class="mark" href="/">Afterlight</a>
    <nav>
      <button type="button" data-go="wall">The wall</button>
      <button type="button" data-go="desk">Your desk</button>
      <button type="button" id="authBtn">Sign in</button>
    </nav>
  </header>

  <main>
    <section id="view-home" class="view active">
      <p class="kicker" id="kicker">This hour</p>
      <h1 id="featureTitle">The lamp is still warm</h1>
      <p class="lede" id="featureBody"></p>
      <p class="meta" id="featureMeta"></p>
      <div class="hourbar">
        <div class="hourfill" id="hourFill"></div>
      </div>
      <p class="tick" id="tick"></p>
    </section>

    <section id="view-wall" class="view">
      <h2>Public notes</h2>
      <p class="sub">Anything a visitor marked public sits here. Private notes stay on their desk.</p>
      <div id="wallList" class="cards"></div>
    </section>

    <section id="view-desk" class="view">
      <h2>Your desk</h2>
      <p class="sub" id="deskHint">Sign in to keep notes. Public ones appear on the wall.</p>
      <form id="noteForm" class="sheet hidden">
        <input name="title" maxlength="80" placeholder="A short title" required />
        <textarea name="body" rows="6" maxlength="2000" placeholder="Leave something for later, or for the room." required></textarea>
        <label class="check">
          <input type="checkbox" name="is_public" />
          Show this on the public wall
        </label>
        <button type="submit">Save note</button>
      </form>
      <div id="deskList" class="cards"></div>
    </section>

    <section id="view-auth" class="view">
      <h2 id="authTitle">Sign in</h2>
      <form id="authForm" class="sheet">
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" minlength="6" required />
        <button type="submit">Continue</button>
      </form>
      <button type="button" class="ghost" id="toggleMode">Need an account? Create one</button>
      <p class="msg" id="authMsg"></p>
    </section>
  </main>

  <footer>
    <span>The room turns over on the hour.</span>
    <span id="who"></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./app.js"></script>
</body>
</html>
